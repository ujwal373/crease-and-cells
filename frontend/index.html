<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crease and Cells</title>
  </head>
  <body>
    <div id="app">
      <header class="wallet-bar">
        <span class="app-title">Crease &amp; Cells</span>
        <div class="wallet-stats">
          <span id="stat-coins">0 coins</span>
          <span id="stat-xp">0 XP</span>
          <span id="stat-level">Lv 1</span>
        </div>
        <button id="btn-customize" class="btn-secondary">Customize</button>
        <button id="btn-store" class="btn-secondary">Store</button>
      </header>

      <main class="layout">
        <aside class="mission-panel" id="mission-panel">
          <div id="npc-badge" class="npc-badge"></div>
          <h2 id="mission-title" class="mission-title"></h2>
          <p id="mission-story" class="mission-story"></p>
          <div class="task-box">
            <span class="task-label">Task</span>
            <p id="mission-task"></p>
          </div>
          <div id="hint-area" class="hint-area hidden"></div>
        </aside>

        <section class="grid-panel" id="grid-panel">
          <div class="sheet-name-bar" id="sheet-name"></div>

          <div class="grid-scroll">
            <table id="sheet-table" class="sheet-table"></table>
          </div>

          <div class="formula-area">
            <span class="formula-label">fx</span>
            <input
              id="formula-input"
              type="text"
              class="formula-input"
              placeholder='=COUNTIF(G2:G61,"&gt;8")'
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div id="preview-status" class="preview-status hidden"></div>

          <div class="action-row">
            <button id="btn-submit" class="btn-primary" disabled>Submit</button>
            <button id="btn-hint" class="btn-secondary">Hint</button>
          </div>

          <div id="result-panel" class="result-panel hidden"></div>

          <div class="coach-area">
            <div class="coach-input-row">
              <input
                id="coach-input"
                type="text"
                class="coach-input"
                placeholder="Ask Coach Rao a question…"
                autocomplete="off"
              />
              <button id="btn-coach" class="btn-secondary">Ask</button>
            </div>
            <div id="coach-reply" class="coach-reply hidden"></div>
          </div>
        </section>
      </main>

      <div id="loading-overlay" class="overlay loading-overlay">
        <div class="loading-box">Loading…</div>
      </div>

      <div id="store-overlay" class="overlay hidden">
        <div class="overlay-dialog" role="dialog" aria-label="Store">
          <div class="overlay-header">
            <h3>Store</h3>
            <button id="btn-close-store" class="btn-icon" aria-label="Close store">✕</button>
          </div>
          <ul id="store-list" class="store-list"></ul>
        </div>
      </div>

      <div id="creator-overlay" class="overlay hidden">
        <div class="overlay-dialog creator-dialog" role="dialog" aria-label="Character Creator">
          <div class="overlay-header">
            <h3>Create Your Character</h3>
          </div>
          <div class="creator-body">
            <div class="creator-preview">
              <canvas id="creator-canvas" width="160" height="240"></canvas>
            </div>
            <div class="creator-form">
              <div class="creator-field">
                <label for="creator-name">Name</label>
                <input id="creator-name" type="text" maxlength="30" autocomplete="off" />
              </div>
              <div class="creator-field">
                <label for="creator-body-type">Build</label>
                <select id="creator-body-type">
                  <option value="lean">Lean</option>
                  <option value="medium" selected>Medium</option>
                  <option value="stocky">Stocky</option>
                </select>
              </div>
              <div class="creator-field">
                <label for="creator-skin-tone">Skin Tone</label>
                <select id="creator-skin-tone">
                  <option value="light">Light</option>
                  <option value="medium_light">Medium Light</option>
                  <option value="medium" selected>Medium</option>
                  <option value="medium_dark">Medium Dark</option>
                  <option value="dark">Dark</option>
                </select>
              </div>
              <div class="creator-field">
                <label for="creator-hair-style">Hair Style</label>
                <select id="creator-hair-style">
                  <option value="short" selected>Short</option>
                  <option value="medium">Medium</option>
                  <option value="long">Long</option>
                  <option value="bald">Bald</option>
                  <option value="spiky">Spiky</option>
                </select>
              </div>
              <div class="creator-field">
                <label for="creator-hair-colour">Hair Colour</label>
                <select id="creator-hair-colour">
                  <option value="black" selected>Black</option>
                  <option value="brown">Brown</option>
                  <option value="blonde">Blonde</option>
                  <option value="red">Red</option>
                  <option value="grey">Grey</option>
                  <option value="white">White</option>
                </select>
              </div>
              <div id="creator-error" class="creator-error hidden"></div>
              <div class="creator-actions">
                <button id="btn-creator-save" class="btn-primary">Save</button>
                <button id="btn-creator-cancel" class="btn-secondary">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
